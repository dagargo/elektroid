name: Ubuntu CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: jdx/mise-action@v4
      with:
        version: 2026.10.3
        bootstrap: true
    - name: build and test
      run: mise run ci
